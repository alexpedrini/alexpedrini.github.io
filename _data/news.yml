# Fields: date (YYYY-MM-DD), title, text, image.
# Optional: link, image_position (which part of the photo stays in the crop, e.g. "center 30%" = higher up).

- date: 2026-11-05
  title: "I defended my PhD!"
  text: >-
    My thesis is titled <em>"Young star clusters in the act of emerging: a JWST and HST view
    of stellar feedback and timescales"</em>, and my opponent was Dr. Edvige Corbelli from
    INAF-Arcetri. It was an amazing day! Thank you to everyone who came and was there for me.
  image: /assets/images/news1_web.jpg
  image_position: "center 38%"

- date: 2026-07-13
  title: "Talk at GalScale26 in Ascona"
  text: >-
    I gave a talk at the GalScale26 conference in Ascona, Switzerland. The focus of the
    conference was on the many scales of galaxy environments, from stellar feedback to galaxy
    clusters. Such a cool meeting! It was also very nice to meet my master's thesis supervisors
    at a conference for the first time!
  image: /assets/images/ascona_web.jpg
  image_position: "center 40%"

